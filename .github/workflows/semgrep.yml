name: Semgrep

on:
  push:
    branches: [main]
  # ★ NO `branches:` FILTER ON pull_request — DELIBERATE, DO NOT ADD ONE BACK. With `branches: [main]`
  #   this gate did not run at all on a PR targeting a non-main base, so a STACKED PR displayed no gate
  #   run and read to a reviewer as gated while asserting nothing. See scripts/check-pr-trigger-coverage.sh.
  pull_request:
  schedule:
    # Weekly, off-peak (Mondays 05:23 UTC — staggered from CodeQL).
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep CE
        # Standalone / community edition — no SEMGREP_APP_TOKEN, no Semgrep Cloud.
        # Pin setuptools <81: v81 dropped `pkg_resources`, which Semgrep's
        # opentelemetry dependency still imports at startup (otherwise the scan
        # crashes with ModuleNotFoundError before writing any SARIF).
        run: pip install "setuptools<81" "semgrep==1.167.0"

      - name: Run Semgrep
        # Backend rulesets only (no p/react, no p/nextjs — this is a Node/TS service).
        # Never fail the build here; findings surface in the Security tab via SARIF.
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif
        continue-on-error: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
