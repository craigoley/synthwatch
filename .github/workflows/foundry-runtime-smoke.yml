name: Foundry runtime smoke

# Manual only. This starts the existing narrative ACA Job against the current production data,
# verifies the managed-identity request path, and uses the job's post-upsert log as the stored-output
# proof. It does not build, roll, mutate infra, or create a model deployment.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: foundry-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run narrative job and prove Luna output
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            RG=synthwatch-rg
            JOB=synthwatch-narrative-job
            EXPECTED_MODEL=gpt-5.6-luna

            EXEC=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
            echo "Started narrative execution: $EXEC"

            # ACA job log retrieval is preview and its post-execution output has varied across
            # CLI extension versions. Stream the execution while it is live, then use the
            # replica-scoped historical query as a fallback. The proof below is still based on
            # application markers, never on execution status alone.
            STREAM_FILE=$(mktemp)
            az containerapp job logs show -g "$RG" -n "$JOB" --execution "$EXEC" \
              --container narrative --format text --tail 300 --follow true >"$STREAM_FILE" 2>&1 &
            STREAM_PID=$!

            STATUS=
            for _ in $(seq 1 90); do
              STATUS=$(az containerapp job execution show -g "$RG" -n "$JOB" \
                --job-execution-name "$EXEC" --query properties.status -o tsv)
              echo "status: $STATUS"
              case "$STATUS" in
                Succeeded) break ;;
                Failed|Degraded|Cancelled)
                  echo "::error::Narrative execution $EXEC ended: $STATUS"
                  exit 1
                  ;;
              esac
              sleep 10
            done
            if [[ "$STATUS" != Succeeded ]]; then
              kill "$STREAM_PID" 2>/dev/null || true
              wait "$STREAM_PID" 2>/dev/null || true
              echo "::error::Narrative execution $EXEC did not finish within 15 minutes"
              exit 1
            fi

            # Give the stream a brief chance to receive the final upsert line, then stop it so
            # the smoke cannot hang on a preview CLI websocket after the container exits.
            sleep 5
            kill "$STREAM_PID" 2>/dev/null || true
            wait "$STREAM_PID" 2>/dev/null || true

            REPLICA=
            for _ in $(seq 1 12); do
              REPLICA=$(az containerapp job replica list -g "$RG" -n "$JOB" --execution "$EXEC" \
                --query '[0].name' -o tsv 2>/dev/null || true)
              [[ -n "$REPLICA" ]] && break
              sleep 5
            done
            if [[ -z "$REPLICA" ]]; then
              echo "::error::No narrative replica was available for log inspection ($EXEC)"
              exit 1
            fi
            echo "Narrative replica selected: $REPLICA"

            normalize_logs() {
              local raw="$1"
              local parsed=
              if parsed=$(printf '%s\n' "$raw" | jq -r '.. | strings' 2>/dev/null); then
                if [[ -n "$parsed" ]]; then
                  printf '%s\n' "$parsed"
                  return 0
                fi
              fi
              printf '%s\n' "$raw"
            }

            LOG_SOURCE=stream
            LOGS=$(normalize_logs "$(cat "$STREAM_FILE")")
            if ! printf '%s\n' "$LOGS" | grep -Fq '[narrative]'; then
              LOG_SOURCE=replica-text
              LOGS=$(normalize_logs "$(az containerapp job logs show -g "$RG" -n "$JOB" --execution "$EXEC" \
                --replica "$REPLICA" --container narrative --format text --tail 300 2>&1 || true)")
            fi
            if ! printf '%s\n' "$LOGS" | grep -Fq '[narrative]'; then
              LOG_SOURCE=execution-json
              LOGS=$(normalize_logs "$(az containerapp job logs show -g "$RG" -n "$JOB" --execution "$EXEC" \
                --container narrative --format json --tail 300 2>&1 || true)")
            fi
            FLEET_MATCH=$(printf '%s\n' "$LOGS" | grep -F '[narrative] fleet:' | grep -F "($EXPECTED_MODEL)" | tail -1 || true)
            WROTE_MATCH=$(printf '%s\n' "$LOGS" | grep -F '[narrative] wrote ' | tail -1 || true)

            # narrate() reports the selected deployment, and the wrote line is emitted only after the
            # report_narratives upsert completes. Together these prove request acceptance + persistence.
            if [[ -z "$FLEET_MATCH" ]]; then
              LOG_BYTES=${#LOGS}
              echo "::error::Narrative log inspection found no Luna fleet result (source=$LOG_SOURCE log_bytes=$LOG_BYTES)"
              MARKERS=$(printf '%s\n' "$LOGS" | grep -oE '\[narrative\] (fleet:|wrote |done:|AZURE_OPENAI_[^ ]*)' | sort | uniq -c || true)
              printf 'Observed safe markers:\n%s\n' "${MARKERS:-<none>}"
              exit 1
            fi
            if [[ -z "$WROTE_MATCH" ]]; then
              echo "::error::Narrative did not report a stored report_narratives write"
              exit 1
            fi
            echo "Runtime smoke passed: fleet model=$EXPECTED_MODEL"
            echo "Runtime smoke stored-output proof: wrote_marker=observed"
