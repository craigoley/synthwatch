name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, off-peak (Mondays 02:23 UTC).
    - cron: "23 2 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level; the job below elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Publish results to OpenSSF (OIDC) — required for the badge.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard requires credentials NOT be persisted.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF Scorecard API so the README badge resolves.
          publish_results: true

      # Keep the raw SARIF as a workflow artifact (handy for debugging).
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
